name: Build region pages

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - 'features.js'
      - 'features_en.js'
      - 'roma.js'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: build-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/gen-pages.mjs
      - run: node scripts/gen-en.mjs
      - run: node scripts/gen-sitemap.mjs
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seoul en sitemap.xml
          git diff --staged --quiet && echo "변경 없음" && exit 0
          git commit -m "chore: 지역 페이지 자동 생성"
          git pull --rebase origin main
          git push
