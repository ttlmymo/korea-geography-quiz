# 채움지도 배포: main 에 올리면 새 사이트(Astro)를 빌드·점검해 dist/ 만 GitHub Pages 에 올린다
# 저장소 파일이 그대로 공개되지 않는다. 점검(단위 시험 + tools/check.mjs)이 실패하면 올리지 않는다
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # GA·광고는 배포 빌드에만 넣는다(src/layouts/Base.astro)
      - name: 빌드
        run: npm run build
        env:
          PUBLIC_ANALYTICS: 'on'

      - name: 점검
        run: npm run check

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v5
